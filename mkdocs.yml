site_name: Baptiste Ravina
site_url: https://www.baptisteravina.com
site_description: >-
  High energy physicist, working on the ATLAS experiment.
  Particle physics, quantum entanglement, machine learning.
site_author: Baptiste Ravina

theme:
  name: material
  variant: classic   # Zensical: keep the Material look (default is "modern")
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    logo: material/atom-variant
    repo: fontawesome/brands/github
  favicon: assets/favicon.png

extra_css:
  - assets/css/custom.css

extra:
  generator: false   # hides "Made with Material for MkDocs" in the footer
  # Pill colour of each blog category (category slug: colour name from the
  # .pill[data-color] rules in custom.css). Read by main.py (front-page blog
  # preview) and by the blog templates in overrides/. Unknown categories: teal.
  blog_category_colors:
    atlas: teal
    top-quark-physics: amber
    quantum-information: blue
    machine-learning: purple
    effective-field-theory: pink
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bravina
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.cern.ch/ravinab/
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0002-1622-6640
    - icon: fontawesome/solid/envelope
      link: mailto:baptiste.ravina@cern.ch

copyright: "&copy; 2026 Baptiste Ravina"

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list

extra_javascript:
  - assets/js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/home.js
  - assets/js/pages.js

plugins:
  - search:            # Zensical enables search unless switched off
      enabled: false
  # - privacy <currently breaks build because of missing files>
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
  - macros:
      module_name: main
  - git-revision-date-localized:
      enable_creation_date: false
  # - blog:
  #     blog_dir: blog
  #     post_date_format: long
  #     archive: false
  #     categories_name: Topics
  #     categories_allowed:
  #       - ATLAS
  #       - Machine learning
  #       - Top quark physics
  #       - Quantum information

nav:
  - Home: index.md
  - Research: research.md
  - Publications: publications.md
  - Talks: talks.md
  - Team: team.md
  # - Teaching: teaching.md
  # - Outreach: outreach.md
  # - Blog:
  #  - blog/index.md
